[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roguelike"
version = "0.1.0"
description = "A terminal-based roguelike dungeon crawler built with Textual"
requires-python = ">=3.11"
dependencies = ["textual>=0.80"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
roguelike = "roguelike.main:run"

[tool.setuptools.packages.find]
include = ["roguelike*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
